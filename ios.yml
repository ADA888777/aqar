name: بناء iOS — IPA موقّع للمتجر

# مستقل تماماً عن android.yml.
# لا يستخدم KEYSTORE_BASE64 ولا أي سرّ خاص بـ Android.
on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'رفع البناء إلى TestFlight؟'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.35.4'
  BUNDLE_ID: com.kuwait.realestate

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ── 0) الكود ──────────────────────────────────────────
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: التحقق من بنية المشروع
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "::error::pubspec.yaml غير موجود"; exit 1; }
          test -d lib && test -d ios || { echo "::error::بنية المشروع ناقصة"; exit 1; }
          grep -E '^name:|^version:' pubspec.yaml
          echo "عدد ملفات Dart: $(find lib -name '*.dart' | wc -l)"

      # ── 1) التحقق من أسرار iOS قبل إهدار وقت البناء ───────
      - name: التحقق من وجود أسرار توقيع iOS
        id: secrets
        env:
          CERT_P12:        ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD:   ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:         ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -uo pipefail
          missing=""
          [ -z "${CERT_P12:-}" ]        && missing="$missing IOS_CERT_P12_BASE64"
          [ -z "${CERT_PASSWORD:-}" ]   && missing="$missing IOS_CERT_PASSWORD"
          [ -z "${PROFILE:-}" ]         && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "${ASC_KEY_ID:-}" ]      && missing="$missing ASC_KEY_ID"
          [ -z "${ASC_ISSUER_ID:-}" ]   && missing="$missing ASC_ISSUER_ID"
          [ -z "${ASC_PRIVATE_KEY:-}" ] && missing="$missing ASC_PRIVATE_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::warning::أسرار ناقصة:$missing — سيُبنى IPA غير موقّع للتجربة فقط."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ كل أسرار التوقيع موجودة"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 2) الأدوات ────────────────────────────────────────
      - name: اختيار Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: إصدارات الأدوات
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      # ── 3) سلسلة المفاتيح والتوقيع ────────────────────────
      - name: تجهيز شهادة التوقيع و Provisioning Profile
        if: steps.secrets.outputs.signed == 'true'
        env:
          CERT_P12:      ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          echo "── الهويات المتاحة للتوقيع ──"
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" \
                 | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "✓ تم تثبيت الملف: $UUID"

          rm -f "$RUNNER_TEMP/cert.p12"

      # ── 4) الاعتماديات ────────────────────────────────────
      - name: تنظيف وتحميل حزم Flutter
        run: |
          flutter clean
          flutter pub get

      - name: تثبيت CocoaPods
        working-directory: ios
        run: |
          pod install --repo-update

      # ── 5) فحوصات الجودة (نفس فحوصات Android) ─────────────
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos || true

      - name: flutter test
        run: flutter test || true

      # ── 6) التحقق من Bundle ID قبل البناء ─────────────────
      - name: التحقق أن Bundle ID لم يتغير
        run: |
          set -euo pipefail
          FOUND=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj \
                  | sed 's/.*= *//; s/;//' | tr -d ' ')
          echo "Bundle ID الموجود: $FOUND"
          if [ "$FOUND" != "$BUNDLE_ID" ]; then
            echo "::error::Bundle ID تغيّر! متوقع $BUNDLE_ID ووجدنا $FOUND"
            exit 1
          fi
          echo "✓ مطابق"

      # ── 7) البناء ─────────────────────────────────────────
      - name: بناء IPA موقّع
        if: steps.secrets.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: بناء IPA غير موقّع (عند غياب الأسرار)
        if: steps.secrets.outputs.signed != 'true'
        run: flutter build ios --release --no-codesign

      # ── 8) فحص الناتج ─────────────────────────────────────
      - name: فحص الناتج وإنشاء تقرير
        run: |
          set -uo pipefail
          {
            echo "تقرير بناء iOS"
            echo "التاريخ      : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit       : $GITHUB_SHA"
            echo "Flutter      : $(flutter --version | head -1)"
            echo "Xcode        : $(xcodebuild -version | head -1)"
            echo "Bundle ID    : $BUNDLE_ID"
            echo "موقّع        : ${{ steps.secrets.outputs.signed }}"
            echo "الإصدار      : $(grep '^version:' pubspec.yaml)"
            echo ""
            echo "── النواتج ──"
            ls -lh build/ios/ipa/*.ipa 2>/dev/null || echo "(لا يوجد IPA — بناء غير موقّع)"
          } > IOS_BUILD_REPORT.txt
          cat IOS_BUILD_REPORT.txt

      - name: "الناتج 1: IPA"
        if: steps.secrets.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aqar-IPA
          path: build/ios/ipa/*.ipa
          retention-days: 60

      - name: "الناتج 2: تقرير البناء"
        uses: actions/upload-artifact@v4
        with:
          name: IOS_BUILD_REPORT
          path: IOS_BUILD_REPORT.txt
          retention-days: 60

      # ── 9) الرفع إلى App Store Connect (اختياري ويدوي) ────
      - name: رفع إلى TestFlight
        if: >-
          steps.secrets.outputs.signed == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.upload_to_testflight
        env:
          ASC_KEY_ID:      ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID:   ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$ASC_PRIVATE_KEY" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/private_keys

      # ── 10) تنظيف سلسلة المفاتيح دائماً ───────────────────
      - name: تنظيف سلسلة المفاتيح
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
