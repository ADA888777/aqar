name: بناء iOS — IPA ورفعه إلى App Store Connect

# ════════════════════════════════════════════════════════════
# مستقل تماماً عن build.yml الخاص بـ Android.
# لا يستخدم KEYSTORE_BASE64 ولا أي سرّ أندرويد.
# لا يعدّل أي ملف داخل المستودع — كل التعديلات تقع على نسخة
# مؤقتة تُفكّ من الأرشيف داخل الـ runner ثم تختفي.
# ════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'اسم أرشيف المشروع في جذر المستودع'
        required: true
        default: 'zz-aqar-final46.zip'
      build_name:
        description: 'رقم الإصدار — يجب أن يطابق App Store Connect بالضبط'
        required: true
        default: '1.0'
      build_number:
        description: 'رقم البناء — يزيد في كل رفع جديد'
        required: true
        default: '1'
      upload:
        description: 'الرفع إلى App Store Connect بعد البناء؟'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.35.4'
  BUNDLE_ID: com.kuwait.realestate

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # ── 1) التحقق من الأسرار قبل إهدار وقت البناء ──────────
      - name: التحقق من أسرار iOS
        env:
          CERT_P12:      ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID:       ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -uo pipefail
          missing=""
          [ -z "${CERT_P12:-}" ]      && missing="$missing IOS_CERT_P12_BASE64"
          [ -z "${CERT_PASSWORD:-}" ] && missing="$missing IOS_CERT_PASSWORD"
          [ -z "${PROFILE:-}" ]       && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "${TEAM_ID:-}" ]       && missing="$missing IOS_TEAM_ID"
          [ -z "${ASC_KEY_ID:-}" ]    && missing="$missing ASC_KEY_ID"
          [ -z "${ASC_ISSUER_ID:-}" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${ASC_KEY:-}" ]       && missing="$missing ASC_PRIVATE_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing"
            echo "أضفها من: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "كل أسرار iOS السبعة موجودة"

      - name: جلب المستودع
        uses: actions/checkout@v4

      # ── 2) فك الأرشيف (اسم صريح، لا اختيار عشوائي) ─────────
      - name: فك أرشيف المشروع
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
        run: |
          set -euo pipefail
          if [ ! -f "$PROJECT_ZIP" ]; then
            echo "::error::الأرشيف '$PROJECT_ZIP' غير موجود في جذر المستودع"
            echo "الأرشيفات المتاحة:"; ls -la *.zip 2>/dev/null || echo "(لا توجد)"
            exit 1
          fi
          mkdir -p project
          unzip -q "$PROJECT_ZIP" -d project

          # بعض الأرشيفات تحوي مجلداً واحداً في الداخل — نصعّده للأعلى
          if [ ! -f project/pubspec.yaml ]; then
            inner=$(find project -maxdepth 2 -name pubspec.yaml | head -1 || true)
            [ -z "$inner" ] && { echo "::error::لا يوجد pubspec.yaml داخل الأرشيف"; exit 1; }
            d=$(dirname "$inner")
            shopt -s dotglob
            mv "$d"/* project/ 2>/dev/null || true
          fi

          test -d project/ios || { echo "::error::مجلد ios/ غير موجود داخل الأرشيف"; exit 1; }
          echo "── المشروع ──"
          grep -E '^name:|^version:' project/pubspec.yaml
          echo "ملفات Dart: $(find project/lib -name '*.dart' | wc -l)"

      # ── 3) التحقق من Bundle ID ─────────────────────────────
      - name: التحقق أن Bundle ID صحيح
        working-directory: project
        run: |
          set -euo pipefail
          FOUND=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj \
                  | sed 's/.*= *//; s/;//' | tr -d ' ' || true)
          [ -n "$FOUND" ] || { echo "::error::تعذّر قراءة Bundle ID من المشروع"; exit 1; }
          echo "الموجود: $FOUND"
          [ "$FOUND" = "$BUNDLE_ID" ] || {
            echo "::error::Bundle ID غير مطابق. متوقع $BUNDLE_ID"; exit 1; }
          echo "مطابق"

      # ── 4) الأدوات ─────────────────────────────────────────
      - name: اختيار Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: إصدارات الأدوات
        run: flutter --version && xcodebuild -version && pod --version

      # ── 5) الشهادة و Provisioning Profile ──────────────────
      - name: تجهيز التوقيع
        env:
          CERT_P12:      ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS=$(uuidgen)
          echo "KC_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "── هويات التوقيع المتاحة ──"
          security find-identity -v -p codesigning "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/pp.mobileprovision"
          PLIST=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -o - -)
          PPNAME=$(echo "$PLIST" | plutil -extract Name raw -o - -)
          cp "$RUNNER_TEMP/pp.mobileprovision" \
             ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PPNAME" >> "$GITHUB_ENV"
          echo "الملف مثبّت: $PPNAME"

      # ── 6) تصحيح إعدادات التوقيع على نسخة الـ runner ───────
      #     المشروع مضبوط على "iPhone Developer" وهي هوية تطوير
      #     لا تصلح للمتجر. نصححها هنا فقط — المستودع لا يتغيّر.
      - name: تصحيح إعدادات التوقيع للتوزيع
        working-directory: project
        run: |
          set -euo pipefail
          PB=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' "$PB"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PB"
          COUNT=$(grep -c 'Apple Distribution' "$PB" || true)
          echo "مواضع Apple Distribution: ${COUNT:-0}"
          [ "${COUNT:-0}" -gt 0 ] || echo "::warning::لم يُستبدل أي CODE_SIGN_IDENTITY — قد يفشل التوقيع

      # ── 7) الاعتماديات ─────────────────────────────────────
      - name: تحميل الحزم
        working-directory: project
        run: |
          flutter clean
          flutter pub get

      - name: CocoaPods
        working-directory: project/ios
        run: pod install --repo-update

      # ── 8) البناء ──────────────────────────────────────────
      - name: بناء IPA موقّع
        working-directory: project
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          echo "── الإصدار: $BUILD_NAME ($BUILD_NUMBER) ──"
          echo "   يجب أن يطابق رقم الإصدار في App Store Connect وإلا لن يظهر البناء"

          flutter build ipa --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: فحص الناتج وكتابة التقرير
        working-directory: project
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
          BUILD_NAME: ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          # || true ضروري: تحت pipefail فشل ls يُنهي السكربت
          # قبل أن تُطبع رسالة التشخيص أدناه.
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1 || true)
          [ -z "$IPA" ] && { echo "::error::لم يُنتَج أي IPA"; exit 1; }
          ls -lh "$IPA"
          echo "IPA_PATH=$PWD/$IPA" >> "$GITHUB_ENV"
          {
            echo "تقرير بناء iOS"
            echo "التاريخ   : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit    : $GITHUB_SHA"
            echo "الأرشيف   : $PROJECT_ZIP"
            echo "Bundle ID : $BUNDLE_ID"
            echo "الإصدار   : $BUILD_NAME ($BUILD_NUMBER)"
            echo "Profile   : $PROFILE_NAME"
            echo "Flutter   : $(flutter --version | head -1)"
            echo "Xcode     : $(xcodebuild -version | head -1)"
            echo "IPA       : $(basename "$IPA") — $(du -h "$IPA" | cut -f1)"
          } > ../IOS_BUILD_REPORT.txt
          cat ../IOS_BUILD_REPORT.txt

      - name: "الناتج 1: IPA"
        uses: actions/upload-artifact@v4
        with:
          name: aqar-IPA
          path: project/build/ios/ipa/*.ipa
          retention-days: 60

      - name: "الناتج 2: تقرير البناء"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IOS_BUILD_REPORT
          path: IOS_BUILD_REPORT.txt
          retention-days: 60

      # ── 9) الرفع إلى App Store Connect ─────────────────────
      - name: التحقق ثم الرفع
        if: inputs.upload
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          BUILD_NAME:    ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$ASC_KEY" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "── التحقق قبل الرفع ──"
          xcrun altool --validate-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          echo "── الرفع ──"
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          rm -rf ~/private_keys
          echo "تم الرفع. المعالجة تستغرق 10 إلى 30 دقيقة."
          echo "ثم يظهر البناء في TestFlight وفي خانة Build للإصدار $BUILD_NAME"

      # ── 10) تنظيف دائم ─────────────────────────────────────
      - name: تنظيف سلسلة المفاتيح
        if: always()
        run: |
          security delete-keychain "${KC_PATH:-$RUNNER_TEMP/build.keychain}" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true
