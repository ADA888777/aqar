name: بناء iOS — IPA ورفعه إلى App Store Connect
# ════════════════════════════════════════════════════════════
# v4 — إصلاح التوقيع:
#   • استيراد شهادة Apple الوسيطة (WWDR) — بدونها الهوية «غير صالحة»
#   • فحص مبكر: 0 هويات = فشل فوري برسالة واضحة
#   • xcodebuild مباشرة بدل flutter build ipa — يتجاوز فحص
#     «شهادة تطوير» الذي يرفض شهادات التوزيع
# لا يستخدم KEYSTORE_BASE64 ولا أي سرّ أندرويد.
# ════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: 'اسم أرشيف المشروع في جذر المستودع'
        required: true
        default: 'zz-aqar-final90.zip'
      build_name:
        description: 'رقم الإصدار — يجب أن يطابق App Store Connect'
        required: true
        default: '1.0'
      build_number:
        description: 'رقم البناء — يزيد في كل رفع'
        required: true
        default: '1'
      upload:
        description: 'الرفع إلى App Store Connect بعد البناء؟'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.35.4'
  BUNDLE_ID: com.kuwait.realestate

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: التحقق من أسرار iOS
        env:
          CERT_P12:      ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID:       ${{ secrets.IOS_TEAM_ID }}
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -uo pipefail
          missing=""
          [ -z "${CERT_P12:-}" ]      && missing="$missing IOS_CERT_P12_BASE64"
          [ -z "${CERT_PASSWORD:-}" ] && missing="$missing IOS_CERT_PASSWORD"
          [ -z "${PROFILE:-}" ]       && missing="$missing IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "${TEAM_ID:-}" ]       && missing="$missing IOS_TEAM_ID"
          [ -z "${ASC_KEY_ID:-}" ]    && missing="$missing ASC_KEY_ID"
          [ -z "${ASC_ISSUER_ID:-}" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "${ASC_KEY:-}" ]       && missing="$missing ASC_PRIVATE_KEY_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::أسرار ناقصة:$missing"; exit 1
          fi
          echo "كل أسرار iOS السبعة موجودة"

      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: فك أرشيف المشروع
        env:
          PROJECT_ZIP: ${{ inputs.project_zip }}
        run: |
          set -euo pipefail
          [ -f "$PROJECT_ZIP" ] || { echo "::error::الأرشيف '$PROJECT_ZIP' غير موجود"; ls -la *.zip 2>/dev/null || true; exit 1; }
          mkdir -p project
          unzip -q "$PROJECT_ZIP" -d project
          if [ ! -f project/pubspec.yaml ]; then
            inner=$(find project -maxdepth 2 -name pubspec.yaml | head -1 || true)
            [ -z "$inner" ] && { echo "::error::لا يوجد pubspec.yaml داخل الأرشيف"; exit 1; }
            d=$(dirname "$inner"); shopt -s dotglob; mv "$d"/* project/ 2>/dev/null || true
          fi
          test -d project/ios || { echo "::error::مجلد ios/ غير موجود"; exit 1; }
          grep -E '^name:|^version:' project/pubspec.yaml
          echo "ملفات Dart: $(find project/lib -name '*.dart' | wc -l)"

      - name: التحقق أن Bundle ID صحيح
        working-directory: project
        run: |
          set -euo pipefail
          FOUND=$(grep -m1 'PRODUCT_BUNDLE_IDENTIFIER' ios/Runner.xcodeproj/project.pbxproj | sed 's/.*= *//; s/;//' | tr -d ' ' || true)
          [ -n "$FOUND" ] || { echo "::error::تعذّر قراءة Bundle ID"; exit 1; }
          [ "$FOUND" = "$BUNDLE_ID" ] || { echo "::error::Bundle ID غير مطابق: $FOUND"; exit 1; }
          echo "Bundle ID مطابق: $FOUND"

      - name: اختيار Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: إصدارات الأدوات
        run: flutter --version && xcodebuild -version && pod --version

      # ── التوقيع: سلسلة مفاتيح مؤقتة + WWDR + الشهادة + الملف ──
      - name: تجهيز التوقيع
        env:
          CERT_P12:      ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE:       ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KC_PASS=$(uuidgen)
          echo "KC_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -s "$KEYCHAIN"

          # ── الشهادة الوسيطة من Apple (WWDR G3 + G4) ──
          # بدونها تُعتبر شهادة التوزيع «غير صالحة» ولا تظهر في find-identity.
          # هذا السبب الأشيع لـ "No valid code signing certificates" في CI.
          echo "── استيراد شهادات Apple الوسيطة ──"
          for g in G3 G4; do
            curl -fsSL -o "$RUNNER_TEMP/wwdr$g.cer" "https://www.apple.com/certificateauthority/AppleWWDRCA$g.cer"
            security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KEYCHAIN" -T /usr/bin/codesign -A || true
          done

          echo "── استيراد شهادة التوزيع ──"
          echo "$CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "── الهويات الصالحة ──"
          security find-identity -v -p codesigning "$KEYCHAIN"
          COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -cE "^ +[0-9]+\)" || true)
          if [ "${COUNT:-0}" -eq 0 ]; then
            echo "::error::0 هويات توقيع صالحة. الأسباب المحتملة:"
            echo "  1) ملف .p12 يحوي الشهادة بلا المفتاح الخاص — أعد تصديره من نفس الجهاز الذي أنشأ CSR"
            echo "  2) كلمة مرور IOS_CERT_PASSWORD خاطئة"
            echo "  3) الشهادة من نوع Development لا Distribution"
            exit 1
          fi
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "الهوية: $IDENTITY"

          echo "── Provisioning Profile ──"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/pp.mobileprovision"
          PLIST=$(security cms -D -i "$RUNNER_TEMP/pp.mobileprovision")
          UUID=$(echo "$PLIST" | plutil -extract UUID raw -o - -)
          PPNAME=$(echo "$PLIST" | plutil -extract Name raw -o - -)
          PPAPP=$(echo "$PLIST" | plutil -extract Entitlements.application-identifier raw -o - - || true)
          cp "$RUNNER_TEMP/pp.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PPNAME" >> "$GITHUB_ENV"
          echo "الملف: $PPNAME ($UUID) — التطبيق: $PPAPP"
          case "$PPAPP" in
            "$BUNDLE_ID") echo "Profile يطابق Bundle ID" ;;
            *) echo "::warning::Profile لا يطابق $BUNDLE_ID — قد يفشل التصدير" ;;
          esac

      - name: تحميل الحزم
        working-directory: project
        run: flutter clean && flutter pub get

      - name: CocoaPods
        working-directory: project/ios
        run: pod install --repo-update

      # ── البناء: Flutter بلا توقيع، ثم xcodebuild يوقّع صراحةً ──
      # يتجاوز فحص Flutter الذي يبحث عن «شهادة تطوير» ويرفض التوزيع.
      - name: بناء Flutter (بلا توقيع)
        working-directory: project
        env:
          BUILD_NAME:   ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          echo "── الإصدار: $BUILD_NAME ($BUILD_NUMBER) ──"
          flutter build ios --release --no-codesign \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: أرشفة وتوقيع بـ xcodebuild
        working-directory: project/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC_PATH" \
            archive | tail -40

      - name: تصدير IPA
        working-directory: project/ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" | tail -20
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1 || true)
          [ -n "$IPA" ] || { echo "::error::لم يُنتَج IPA"; exit 1; }
          ls -lh "$IPA"
          mkdir -p "$GITHUB_WORKSPACE/out" && cp "$IPA" "$GITHUB_WORKSPACE/out/aqar.ipa"
          echo "IPA_PATH=$GITHUB_WORKSPACE/out/aqar.ipa" >> "$GITHUB_ENV"

      - name: تقرير البناء
        env:
          PROJECT_ZIP:  ${{ inputs.project_zip }}
          BUILD_NAME:   ${{ inputs.build_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          {
            echo "تقرير بناء iOS"
            echo "التاريخ   : $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "الأرشيف   : $PROJECT_ZIP"
            echo "Bundle ID : $BUNDLE_ID"
            echo "الإصدار   : $BUILD_NAME ($BUILD_NUMBER)"
            echo "الهوية    : $SIGN_IDENTITY"
            echo "Profile   : $PROFILE_NAME"
            echo "IPA       : $(du -h "$IPA_PATH" | cut -f1)"
          } > IOS_BUILD_REPORT.txt
          cat IOS_BUILD_REPORT.txt

      - name: "الناتج: IPA"
        uses: actions/upload-artifact@v4
        with:
          name: aqar-IPA
          path: out/aqar.ipa
          retention-days: 7

      - name: "الناتج: التقرير"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IOS_BUILD_REPORT
          path: IOS_BUILD_REPORT.txt
          retention-days: 7

      - name: الرفع إلى App Store Connect
        if: inputs.upload
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY:       ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          BUILD_NAME:    ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$ASC_KEY" | base64 -d > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app   -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -rf ~/private_keys
          echo "تم الرفع. المعالجة 10–30 دقيقة، ثم يظهر البناء $BUILD_NAME في TestFlight."

      - name: تنظيف
        if: always()
        run: |
          security delete-keychain "${KC_PATH:-$RUNNER_TEMP/build.keychain}" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision 2>/dev/null || true
          rm -rf ~/private_keys 2>/dev/null || true
